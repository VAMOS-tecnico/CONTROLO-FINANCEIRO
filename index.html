<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controlo Bancário</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:linear-gradient(135deg,#1e3a5f 0%,#0f2744 50%,#1a1042 100%);padding:1.5rem 2rem 1.2rem;border-bottom:1px solid rgba(255,255,255,0.08)}
.header h1{font-size:22px;font-weight:600;color:#fff;letter-spacing:-.3px}
.header p{font-size:13px;color:#94a3b8;margin-top:3px}
.body{padding:1.5rem 2rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem}
.tab{padding:7px 15px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);cursor:pointer;font-size:13px;color:#94a3b8;transition:all .15s}
.tab.active{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-color:#3b82f6;font-weight:500;box-shadow:0 2px 12px rgba(37,99,235,0.4)}
.tab:hover:not(.active){background:rgba(255,255,255,0.1);color:#e2e8f0}
.page{display:none}.page.active{display:block}
.section-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#64748b;margin:1.4rem 0 .6rem;padding-left:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:1.5rem}
.metric{background:rgba(30,58,95,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 16px}
.metric-label{font-size:12px;color:#64748b;margin-bottom:6px;font-weight:500}
.metric-value{font-size:22px;font-weight:600;color:#e2e8f0}
.metric-value.green{color:#34d399}
.metric-value.red{color:#f87171}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:rgba(255,255,255,0.06);color:#64748b;padding:7px 8px;text-align:right;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.08);white-space:nowrap;font-size:11px;letter-spacing:.03em}
th:first-child{text-align:left;min-width:150px}
td{padding:5px 8px;text-align:right;border-bottom:1px solid rgba(255,255,255,0.05);color:#cbd5e1;white-space:nowrap}
td:first-child{text-align:left;color:#94a3b8;min-width:150px}
tr:hover td{background:rgba(255,255,255,0.03)}
tr.total td{font-weight:600;background:rgba(37,99,235,0.12);color:#e2e8f0;border-top:1px solid rgba(37,99,235,0.3)}
tr.total td:first-child{color:#93c5fd}
.cell-input{width:76px;text-align:right;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:5px;font-size:12px;color:#60a5fa;font-family:inherit;padding:3px 6px;display:block;transition:all .15s}
.cell-input:focus{outline:none;border-color:#3b82f6;background:rgba(59,130,246,0.15);color:#93c5fd}
.cell-input::placeholder{color:#334155}
.resumo-table{width:100%;border-collapse:collapse;font-size:13px}
.resumo-table th{background:rgba(255,255,255,0.06);padding:10px 14px;text-align:right;font-weight:600;color:#64748b;border-bottom:1px solid rgba(255,255,255,0.08);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.resumo-table th:first-child{text-align:left}
.resumo-table td{padding:10px 14px;text-align:right;border-bottom:1px solid rgba(255,255,255,0.05);color:#cbd5e1}
.resumo-table td:first-child{text-align:left;font-weight:500;color:#e2e8f0}
.resumo-table tr:hover td{background:rgba(255,255,255,0.03)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge.pos{background:rgba(52,211,153,0.15);color:#34d399;border:1px solid rgba(52,211,153,0.25)}
.badge.neg{background:rgba(248,113,113,0.15);color:#f87171;border:1px solid rgba(248,113,113,0.25)}
.badge.zero{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.25)}
@media(max-width:600px){.body{padding:1rem}.header{padding:1rem 1rem .8rem}th:first-child,td:first-child{min-width:100px}.cell-input{width:58px}}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
    <div>
      <h1>💳 Controlo Bancário</h1>
      <p>Gestão de contas — Moçambique</p>
    </div>
    <div style="text-align:right">
      <div style="font-size:11px;color:#64748b;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:3px">CEO</div>
      <div style="font-size:16px;font-weight:600;color:#fff">Abel Francisco</div>
    </div>
  </div>
</div>
<div class="body">
<div class="tabs" id="tabs"></div>
<div id="pages"></div>
</div>

<script>
const MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const BANKS=['BCI','BIM (Millennium)','FNB','Millennium BIM 2','Moza Banco','Standard Bank','Thembani Digital'];
const ENTRADA_ROWS=['Depósito em Dinheiro','Transferência Recebida','Outros Rendimentos'];
const SAIDA_ROWS=['Levantamento em Dinheiro','Transferência Enviada','Pagamento de Serviços','Outras Despesas'];

const state = BANKS.map(() => ({
  entradas: ENTRADA_ROWS.map(() => Array(12).fill(0)),
  saidas:   SAIDA_ROWS.map(()   => Array(12).fill(0))
}));

state[1].entradas[0][0] = 10000;
state[4].entradas[1][0] = 5000;
state[0].entradas[1][0] = 30000;

function fmt(n) {
  if (!n || n === 0) return '-';
  return n.toLocaleString('pt-PT', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function sumEntradas(bi, mi) { return state[bi].entradas.reduce((s,r) => s + r[mi], 0); }
function sumSaidas(bi, mi)   { return state[bi].saidas.reduce((s,r)   => s + r[mi], 0); }
function saldoFinal(bi, mi)  { return sumEntradas(bi,mi) - sumSaidas(bi,mi); }
function totalEntradasBank(bi){ return MONTHS.reduce((_,__,m)=>_+sumEntradas(bi,m),0); }
function totalSaidasBank(bi)  { return MONTHS.reduce((_,__,m)=>_+sumSaidas(bi,m),0); }
function saldoFinalTotal(bi)  { return MONTHS.reduce((_,__,m)=>_+saldoFinal(bi,m),0); }

function makeId(bi, sec, ri, mi) { return `c_${bi}_${sec}_${ri}_${mi}`; }

function buildMonthTable(bi, sec, rows) {
  let h = `<table><thead><tr><th>Descrição</th>`;
  MONTHS.forEach(m => h += `<th>${m}</th>`);
  h += `<th>Total</th></tr></thead><tbody>`;
  rows.forEach((row, ri) => {
    h += `<tr><td>${row}</td>`;
    MONTHS.forEach((_, mi) => {
      const id = makeId(bi, sec, ri, mi);
      const val = state[bi][sec][ri][mi];
      h += `<td><input class="cell-input" id="${id}" type="text" inputmode="numeric" value="${val || ''}" placeholder="0"></td>`;
    });
    h += `<td id="rt_${bi}_${sec}_${ri}">-</td></tr>`;
  });
  h += `<tr class="total"><td>TOTAL</td>`;
  MONTHS.forEach((_, mi) => h += `<td id="ct_${bi}_${sec}_${mi}">-</td>`);
  h += `<td id="gt_${bi}_${sec}">-</td></tr></tbody></table>`;
  return h;
}

function buildBankPage(bi) {
  return `
  <div class="grid">
    <div class="metric"><div class="metric-label">Total Entradas</div><div class="metric-value green" id="me_${bi}">-</div></div>
    <div class="metric"><div class="metric-label">Total Saídas</div><div class="metric-value red" id="ms_${bi}">-</div></div>
    <div class="metric"><div class="metric-label">Saldo Final</div><div class="metric-value green" id="msf_${bi}">-</div></div>
  </div>
  <p class="section-title">Depósitos / Entradas (MZN)</p>
  <div class="card">${buildMonthTable(bi, 'entradas', ENTRADA_ROWS)}</div>
  <p class="section-title">Saques / Saídas (MZN)</p>
  <div class="card">${buildMonthTable(bi, 'saidas', SAIDA_ROWS)}</div>
  <p class="section-title">Resumo de Saldo (MZN)</p>
  <div class="card">
    <table><thead><tr><th>Saldo</th>${MONTHS.map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr></thead>
    <tbody><tr class="total"><td>Saldo Final</td>
    ${MONTHS.map((_,mi)=>`<td id="sf_${bi}_${mi}">-</td>`).join('')}
    <td id="sft_${bi}">-</td></tr></tbody></table>
  </div>`;
}

function buildResumoPage() {
  let h = `<div class="card"><table class="resumo-table"><thead><tr>
    <th>Banco</th><th>Total Entradas (MZN)</th><th>Total Saídas (MZN)</th><th>Saldo Final (MZN)</th><th>Estado</th>
  </tr></thead><tbody>`;
  BANKS.forEach((b, bi) => {
    h += `<tr><td>${b}</td><td id="re_${bi}">-</td><td id="rs_${bi}">-</td><td id="rsf_${bi}">-</td><td id="rest_${bi}">-</td></tr>`;
  });
  h += `</tbody></table></div>`;
  return h;
}

function refreshBank(bi) {
  ['entradas','saidas'].forEach(sec => {
    const rows = sec === 'entradas' ? ENTRADA_ROWS : SAIDA_ROWS;
    rows.forEach((_, ri) => {
      const t = state[bi][sec][ri].reduce((s,v)=>s+v,0);
      const el = document.getElementById(`rt_${bi}_${sec}_${ri}`);
      if (el) el.textContent = fmt(t);
    });
    MONTHS.forEach((_,mi) => {
      const t = sec === 'entradas' ? sumEntradas(bi,mi) : sumSaidas(bi,mi);
      const el = document.getElementById(`ct_${bi}_${sec}_${mi}`);
      if (el) el.textContent = fmt(t);
    });
    const grand = sec === 'entradas' ? totalEntradasBank(bi) : totalSaidasBank(bi);
    const el = document.getElementById(`gt_${bi}_${sec}`);
    if (el) el.textContent = fmt(grand);
  });
  MONTHS.forEach((_,mi) => {
    const el = document.getElementById(`sf_${bi}_${mi}`);
    if (el) el.textContent = fmt(saldoFinal(bi,mi));
  });
  const te = totalEntradasBank(bi), ts = totalSaidasBank(bi), sf = saldoFinalTotal(bi);
  const sfte = document.getElementById(`sft_${bi}`);
  if (sfte) sfte.textContent = fmt(sf);
  const me = document.getElementById(`me_${bi}`);
  const ms = document.getElementById(`ms_${bi}`);
  const msf = document.getElementById(`msf_${bi}`);
  if (me) me.textContent = fmt(te) + ' MZN';
  if (ms) ms.textContent = fmt(ts) + ' MZN';
  if (msf) { msf.textContent = fmt(sf) + ' MZN'; msf.className = 'metric-value ' + (sf >= 0 ? 'green' : 'red'); }
}

function refreshResumo() {
  BANKS.forEach((_, bi) => {
    const te=totalEntradasBank(bi), ts=totalSaidasBank(bi), sf=saldoFinalTotal(bi);
    const el_e=document.getElementById(`re_${bi}`);
    const el_s=document.getElementById(`rs_${bi}`);
    const el_sf=document.getElementById(`rsf_${bi}`);
    const el_st=document.getElementById(`rest_${bi}`);
    if(el_e) el_e.textContent=fmt(te);
    if(el_s) el_s.textContent=fmt(ts);
    if(el_sf) el_sf.textContent=fmt(sf);
    if(el_st) el_st.innerHTML = sf>0
      ? '<span class="badge pos">✅ Positivo</span>'
      : sf<0 ? '<span class="badge neg">❌ Negativo</span>'
      : '<span class="badge zero">⚠️ Zero</span>';
  });
}

const tabsEl = document.getElementById('tabs');
const pagesEl = document.getElementById('pages');
let thtml = `<button class="tab active" onclick="switchTab('resumo',this)">Resumo Geral</button>`;
let phtml = `<div class="page active" id="page_resumo">${buildResumoPage()}</div>`;
BANKS.forEach((b, bi) => {
  thtml += `<button class="tab" onclick="switchTab('b${bi}',this)">${b}</button>`;
  phtml += `<div class="page" id="page_b${bi}">${buildBankPage(bi)}</div>`;
});
tabsEl.innerHTML = thtml;
pagesEl.innerHTML = phtml;

BANKS.forEach((_, bi) => {
  ['entradas','saidas'].forEach(sec => {
    const rows = sec === 'entradas' ? ENTRADA_ROWS : SAIDA_ROWS;
    rows.forEach((_, ri) => {
      MONTHS.forEach((_, mi) => {
        const el = document.getElementById(makeId(bi, sec, ri, mi));
        if (!el) return;
        el.addEventListener('input', function() {
          const raw = this.value.trim();
          let v = 0;
          if (raw) {
            let s = raw;
            if (s.includes('.') && s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
            else if (s.includes(',')) s = s.replace(',','.');
            v = parseFloat(s) || 0;
          }
          state[bi][sec][ri][mi] = v;
          refreshBank(bi);
          refreshResumo();
        });
        el.addEventListener('focus', function() { this.select(); });
      });
    });
  });
});

BANKS.forEach((_, bi) => refreshBank(bi));
refreshResumo();

function switchTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page_' + id).classList.add('active');
}
</script>
</body>
</html>
