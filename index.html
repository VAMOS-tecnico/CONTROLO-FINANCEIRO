<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controlo Bancário</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh;padding:1.5rem}
h1{font-size:20px;font-weight:500;margin-bottom:1.25rem;color:#1a1a18}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem}
.tab{padding:6px 14px;border-radius:8px;border:1px solid #c8c6bc;background:#fff;cursor:pointer;font-size:13px;color:#5f5e5a;transition:all .15s}
.tab.active{background:#e6f1fb;color:#185fa5;border-color:#85b7eb;font-weight:500}
.tab:hover:not(.active){background:#f1efe8}
.page{display:none}.page.active{display:block}
.section-title{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#5f5e5a;margin:1.2rem 0 .5rem;padding-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.5rem}
.metric{background:#f1efe8;border-radius:8px;padding:12px 14px}
.metric-label{font-size:12px;color:#5f5e5a;margin-bottom:4px}
.metric-value{font-size:20px;font-weight:500;color:#1a1a18}
.metric-value.green{color:#3b6d11}
.metric-value.red{color:#a32d2d}
.card{background:#fff;border:1px solid #d3d1c7;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f1efe8;color:#5f5e5a;padding:6px 8px;text-align:right;font-weight:500;border-bottom:1px solid #d3d1c7;white-space:nowrap}
th:first-child{text-align:left;min-width:150px}
td{padding:4px 6px;text-align:right;border-bottom:1px solid #eee;color:#1a1a18;white-space:nowrap}
td:first-child{text-align:left;color:#5f5e5a;min-width:150px}
tr.total td{font-weight:600;background:#f1efe8;color:#1a1a18}
tr.total td:first-child{color:#1a1a18}
.cell-input{width:72px;text-align:right;background:#fff;border:1px solid #c8c6bc;border-radius:4px;font-size:12px;color:#185fa5;font-family:inherit;padding:3px 5px;display:block}
.cell-input:focus{outline:none;border-color:#85b7eb;background:#e6f1fb}
.resumo-table{width:100%;border-collapse:collapse;font-size:13px}
.resumo-table th{background:#f1efe8;padding:8px 12px;text-align:right;font-weight:500;color:#5f5e5a;border-bottom:1px solid #d3d1c7}
.resumo-table th:first-child{text-align:left}
.resumo-table td{padding:8px 12px;text-align:right;border-bottom:1px solid #eee;color:#1a1a18}
.resumo-table td:first-child{text-align:left;font-weight:500}
.resumo-table tr.total td{font-weight:600;background:#f1efe8}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:500}
.badge.pos{background:#eaf3de;color:#3b6d11}
.badge.neg{background:#fcebeb;color:#a32d2d}
.badge.zero{background:#faeeda;color:#854f0b}
@media(max-width:600px){th:first-child,td:first-child{min-width:100px}.cell-input{width:58px}}
</style>
</head>
<body>
<h1>Controlo Bancário</h1>
<div class="tabs" id="tabs"></div>
<div id="pages"></div>

<script>
const MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const BANKS=['BIM (Millennium)','Millennium BIM 2','Moza Banco','BCI','Standard Bank','FNB','Thembani Digital'];
const ENTRADA_ROWS=['Depósito em Dinheiro','Transferência Recebida','Outros Rendimentos'];
const SAIDA_ROWS=['Levantamento em Dinheiro','Transferência Enviada','Pagamento de Serviços','Outras Despesas'];

// state[bankIdx][section][rowIdx][monthIdx]
const state = BANKS.map(() => ({
  entradas: ENTRADA_ROWS.map(() => Array(12).fill(0)),
  saidas:   SAIDA_ROWS.map(()   => Array(12).fill(0))
}));

// Seed initial values
state[0].entradas[0][0] = 10000; // BIM Jan depósito
state[2].entradas[1][0] = 5000;  // Moza Banco Jan transf
state[3].entradas[1][0] = 30000; // BCI Jan transf

function fmt(n) {
  if (!n || n === 0) return '-';
  return n.toLocaleString('pt-MZ', {minimumFractionDigits:0, maximumFractionDigits:0});
}

function sumEntradas(bi, mi) { return state[bi].entradas.reduce((s,r) => s + r[mi], 0); }
function sumSaidas(bi, mi)   { return state[bi].saidas.reduce((s,r)   => s + r[mi], 0); }
function saldoFinal(bi, mi)  { return sumEntradas(bi,mi) - sumSaidas(bi,mi); }
function totalEntradasBank(bi){ return MONTHS.reduce((_,__,m)=>_+sumEntradas(bi,m),0); }
function totalSaidasBank(bi)  { return MONTHS.reduce((_,__,m)=>_+sumSaidas(bi,m),0); }
function saldoFinalTotal(bi)  { return MONTHS.reduce((_,__,m)=>_+saldoFinal(bi,m),0); }

function makeId(bi, sec, ri, mi) { return `c_${bi}_${sec}_${ri}_${mi}`; }

function buildMonthTable(bi, sec, rows) {
  let h = `<table><thead><tr><th>Descrição</th>`;
  MONTHS.forEach(m => h += `<th>${m}</th>`);
  h += `<th>Total</th></tr></thead><tbody>`;

  rows.forEach((row, ri) => {
    h += `<tr><td>${row}</td>`;
    MONTHS.forEach((_, mi) => {
      const id = makeId(bi, sec, ri, mi);
      const val = state[bi][sec][ri][mi];
      h += `<td><input class="cell-input" id="${id}" type="text" inputmode="numeric" value="${val || ''}" placeholder="0"></td>`;
    });
    h += `<td id="rt_${bi}_${sec}_${ri}">-</td></tr>`;
  });

  h += `<tr class="total"><td>TOTAL</td>`;
  MONTHS.forEach((_, mi) => h += `<td id="ct_${bi}_${sec}_${mi}">-</td>`);
  h += `<td id="gt_${bi}_${sec}">-</td></tr></tbody></table>`;
  return h;
}

function buildBankPage(bi) {
  return `
  <div class="grid">
    <div class="metric"><div class="metric-label">Total Entradas</div><div class="metric-value green" id="me_${bi}">-</div></div>
    <div class="metric"><div class="metric-label">Total Saídas</div><div class="metric-value red" id="ms_${bi}">-</div></div>
    <div class="metric"><div class="metric-label">Saldo Final</div><div class="metric-value green" id="msf_${bi}">-</div></div>
  </div>
  <p class="section-title">Depósitos / Entradas (MZN)</p>
  <div class="card">${buildMonthTable(bi, 'entradas', ENTRADA_ROWS)}</div>
  <p class="section-title">Saques / Saídas (MZN)</p>
  <div class="card">${buildMonthTable(bi, 'saidas', SAIDA_ROWS)}</div>
  <p class="section-title">Resumo de Saldo (MZN)</p>
  <div class="card">
    <table><thead><tr><th>Saldo</th>${MONTHS.map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr></thead>
    <tbody><tr class="total"><td>Saldo Final</td>
    ${MONTHS.map((_,mi)=>`<td id="sf_${bi}_${mi}">-</td>`).join('')}
    <td id="sft_${bi}">-</td></tr></tbody></table>
  </div>`;
}

function buildResumoPage() {
  let h = `<div class="card"><table class="resumo-table"><thead><tr>
    <th>Banco</th><th>Total Entradas (MZN)</th><th>Total Saídas (MZN)</th><th>Saldo Final (MZN)</th><th>Estado</th>
  </tr></thead><tbody>`;
  BANKS.forEach((b, bi) => {
    h += `<tr><td>${b}</td><td id="re_${bi}">-</td><td id="rs_${bi}">-</td><td id="rsf_${bi}">-</td><td id="rest_${bi}">-</td></tr>`;
  });

  h += `</tbody></table></div>`;
  return h;
}

function refreshBank(bi) {
  // Row totals
  ['entradas','saidas'].forEach(sec => {
    const rows = sec === 'entradas' ? ENTRADA_ROWS : SAIDA_ROWS;
    rows.forEach((_, ri) => {
      const t = state[bi][sec][ri].reduce((s,v)=>s+v,0);
      const el = document.getElementById(`rt_${bi}_${sec}_${ri}`);
      if (el) el.textContent = fmt(t);
    });
    MONTHS.forEach((_,mi) => {
      const t = sec === 'entradas' ? sumEntradas(bi,mi) : sumSaidas(bi,mi);
      const el = document.getElementById(`ct_${bi}_${sec}_${mi}`);
      if (el) el.textContent = fmt(t);
    });
    const grand = sec === 'entradas' ? totalEntradasBank(bi) : totalSaidasBank(bi);
    const el = document.getElementById(`gt_${bi}_${sec}`);
    if (el) el.textContent = fmt(grand);
  });
  MONTHS.forEach((_,mi) => {
    const el = document.getElementById(`sf_${bi}_${mi}`);
    if (el) el.textContent = fmt(saldoFinal(bi,mi));
  });
  const te = totalEntradasBank(bi), ts = totalSaidasBank(bi), sf = saldoFinalTotal(bi);
  const sfte = document.getElementById(`sft_${bi}`);
  if (sfte) sfte.textContent = fmt(sf);
  const me = document.getElementById(`me_${bi}`);
  const ms = document.getElementById(`ms_${bi}`);
  const msf = document.getElementById(`msf_${bi}`);
  if (me) me.textContent = fmt(te) + ' MZN';
  if (ms) ms.textContent = fmt(ts) + ' MZN';
  if (msf) { msf.textContent = fmt(sf) + ' MZN'; msf.className = 'metric-value ' + (sf >= 0 ? 'green' : 'red'); }
}

function refreshResumo() {
  let grandE=0, grandS=0, grandSF=0;
  BANKS.forEach((_, bi) => {
    const te=totalEntradasBank(bi), ts=totalSaidasBank(bi), sf=saldoFinalTotal(bi);
    grandE+=te; grandS+=ts; grandSF+=sf;
    const el_e=document.getElementById(`re_${bi}`);
    const el_s=document.getElementById(`rs_${bi}`);
    const el_sf=document.getElementById(`rsf_${bi}`);
    const el_st=document.getElementById(`rest_${bi}`);
    if(el_e) el_e.textContent=fmt(te);
    if(el_s) el_s.textContent=fmt(ts);
    if(el_sf) el_sf.textContent=fmt(sf);
    if(el_st) el_st.innerHTML = sf>0
      ? '<span class="badge pos">✅ Positivo</span>'
      : sf<0 ? '<span class="badge neg">❌ Negativo</span>'
      : '<span class="badge zero">⚠️ Zero</span>';
  });

}

// Build DOM
const tabsEl = document.getElementById('tabs');
const pagesEl = document.getElementById('pages');
let thtml = `<button class="tab active" onclick="switchTab('resumo',this)">Resumo Geral</button>`;
let phtml = `<div class="page active" id="page_resumo">${buildResumoPage()}</div>`;
BANKS.forEach((b, bi) => {
  thtml += `<button class="tab" onclick="switchTab('b${bi}',this)">${b}</button>`;
  phtml += `<div class="page" id="page_b${bi}">${buildBankPage(bi)}</div>`;
});
tabsEl.innerHTML = thtml;
pagesEl.innerHTML = phtml;

// Attach input listeners after DOM is built
BANKS.forEach((_, bi) => {
  ['entradas','saidas'].forEach(sec => {
    const rows = sec === 'entradas' ? ENTRADA_ROWS : SAIDA_ROWS;
    rows.forEach((_, ri) => {
      MONTHS.forEach((_, mi) => {
        const el = document.getElementById(makeId(bi, sec, ri, mi));
        if (!el) return;
        el.addEventListener('input', function() {
          const v = parseFloat(this.value.replace(/[^\d.-]/g,'')) || 0;
          state[bi][sec][ri][mi] = v;
          refreshBank(bi);
          refreshResumo();
        });
        el.addEventListener('focus', function() { this.select(); });
      });
    });
  });
});

// Initial render
BANKS.forEach((_, bi) => refreshBank(bi));
refreshResumo();

function switchTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page_' + id).classList.add('active');
}
</script>
</body>
</html>
